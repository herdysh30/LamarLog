name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Universal Release APK
        run: flutter build apk --release --dart-define=REPORT_ENDPOINT=${{ secrets.REPORT_ENDPOINT }}

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --release --split-per-abi --dart-define=REPORT_ENDPOINT=${{ secrets.REPORT_ENDPOINT }}

      - name: Prepare release artifacts
        run: |
          mkdir -p release_artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release_artifacts/LamarLog-${GITHUB_REF_NAME}-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release_artifacts/LamarLog-${GITHUB_REF_NAME}-arm64-v8a.apk"
          ls -lh release_artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LamarLog ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## LamarLog ${{ github.ref_name }}

            ### Downloads
            - **`LamarLog-${{ github.ref_name }}-arm64-v8a.apk`** — Recommended for most modern Android phones (smaller size).
            - **`LamarLog-${{ github.ref_name }}-universal.apk`** — Compatible with all Android architectures.

            See [CHANGELOG.md](https://github.com/herdysh30/LamarLog/blob/main/CHANGELOG.md) for curated release highlights.

            ---
          files: |
            release_artifacts/LamarLog-${{ github.ref_name }}-arm64-v8a.apk
            release_artifacts/LamarLog-${{ github.ref_name }}-universal.apk
